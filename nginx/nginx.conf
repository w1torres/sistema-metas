events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 15m;

    server {
        listen 80;
        server_name metas-adm.tcheagricola.com.br;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name metas-adm.tcheagricola.com.br;
        root /var/www/metas-adm;
        index index.html;

        ssl_certificate /etc/ssl/rootify/fullchain.pem;
        ssl_certificate_key /etc/ssl/rootify/chave.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location /api/ {
            proxy_pass http://api:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_redirect off;
        }

        location = /health {
            proxy_pass http://api:3001/health;
        }

        # Assets versionados pelo Vite podem ser cacheados por muito tempo.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA: qualquer rota do React cai no index.html.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
