# ETAPA 1 (bootstrap) — só HTTP, para emitir o certificado.
# Copiar para /etc/nginx/sites-available/sistema-metas.appstche.com.br
server {
    listen 80;
    listen [::]:80;
    server_name sistema-metas.appstche.com.br;

    root /var/www/metas-adm;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
