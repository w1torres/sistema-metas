# ETAPA 2 (final) — substitui o arquivo da etapa 1 depois de emitir o certificado.
# /etc/nginx/sites-available/sistema-metas.appstche.com.br
server {
    listen 80;
    listen [::]:80;
    server_name sistema-metas.appstche.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/metas-adm;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sistema-metas.appstche.com.br;

    ssl_certificate /etc/letsencrypt/live/sistema-metas.appstche.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistema-metas.appstche.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/metas-adm;
    index index.html;
    client_max_body_size 15m;

    # API (container metas-adm-api, publicado só em 127.0.0.1:3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
    }

    # Assets versionados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota do React cai no index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
