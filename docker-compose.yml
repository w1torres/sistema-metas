# Produção (VPS Hostinger). Sem nginx em container: o nginx nativo do servidor
# (/etc/nginx/sites-available/sistema-metas.appstche.com.br) serve
# /var/www/metas-adm e encaminha /api para a API em 127.0.0.1:3001. Uso: ./deploy-vm.sh (ou docker compose --env-file .env.production up -d --build)
# O compose de desenvolvimento continua em backend/docker-compose.yml.
services:
  postgres:
    image: postgres:15-alpine
    container_name: metas-adm-postgres
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: metas-adm-api
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3001"
      DB_HOST: postgres
      DB_PORT: "5432"
      STORAGE_LOCAL_PATH: /app/uploads
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
